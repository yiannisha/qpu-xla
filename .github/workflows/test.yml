name: Validate

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - '.github/workflows/test.yml'
      - 'src/**'
      - 'examples/**'
      - 'docs/**'
      - 'README.md'
      - 'pyproject.toml'
  schedule:
    - cron: '0 6 * * 1-5'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup uv
      uses: astral-sh/setup-uv@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version-file: ".python-version"

    - name: Install project
      run: uv sync --extra dev

    - name: Run format checker
      run: uv run ruff format --check --diff .

    - name: Run linter
      run: uv run ruff check --show-fixes .

    - name: Run type checker
      run: uv run mypy src/qpu_xla

    - name: Compile examples
      run: uv run python -m compileall examples

    # QPU execution tests require a Raspberry Pi 5 runner with /dev/dri/card0.
