[project]
name = "qpu-xla"
version = "0.1.0"
description = "QPU-first ML kernels and runtime experiments for Raspberry Pi 5 VideoCore VII."
readme = "README.md"
authors = [
    { name = "Yiannis Hadjiyianni", email = "yiannisha@synkrasis-labs.com" },
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.2.2",
    "py-videocore7 @ git+https://github.com/Idein/py-videocore7.git",
]

[project.optional-dependencies]
baselines = [
    "torch>=2.11.0",
]
dev = [
    "mypy>=1.14.1",
    "ruff>=0.9.2",
]

[project.urls]
Homepage = "https://github.com/yiannisha/qpu-xla"
Repository = "https://github.com/yiannisha/qpu-xla"
Documentation = "https://yiannisha.github.io/qpu-xla/"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 119
exclude = [
    ".venv",
    ".git",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "D",
    "UP",
    "N",
]
ignore = ["F403", "F405", "D203", "D213"]

[tool.ruff.lint.pycodestyle]
max-line-length = 119

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "D"]
"examples/*.py" = ["D"]
"examples/igemm_int16.py" = ["F821"]

[tool.mypy]
allow_redefinition = true
allow_untyped_globals = false
check_untyped_defs = true
color_output = true
disallow_incomplete_defs = true
disallow_subclassing_any = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_untyped_defs = true
error_summary = true
ignore_missing_imports = true
implicit_reexport = true
namespace_packages = true
no_implicit_optional = true
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true
show_traceback = true
strict = true
warn_no_return = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = false
